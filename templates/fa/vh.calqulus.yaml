    name: VH*
  steps:
    - add: [MomentContri_Hip_VH_L?name=Lab%20Defined%20-%20Vertical%20Hop%20Left*&index=first, MomentContri_Hip_VH_L?name=Lab%20Defined%20-%20Vertical%20Hop%20Left*&index=last]
    - divide: [$prev, 2]

- parameter: MomentContri_Hip_SYM_mean_VH_R
  where:
    name: VH*
  steps:
    - add: [MomentContri_Hip_VH_R?name=Lab%20Defined%20-%20Vertical%20Hop%20Right*&index=first, MomentContri_Hip_VH_R?name=Lab%20Defined%20-%20Vertical%20Hop%20Right*&index=last]
    - divide: [$prev, 2]

- parameter: MomentContribution_Hip_SYM_VH
  where:
    name: VH*
  steps:
    - subtract: [MomentContri_Hip_SYM_mean_VH_R, MomentContri_Hip_SYM_mean_VH_L]

    - add: [MomentContri_Hip_SYM_mean_VH_R, MomentContri_Hip_SYM_mean_VH_L]

    - divide: [$prev(2), $prev]
    - multiply: [$prev, 200]

