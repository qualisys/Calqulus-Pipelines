- parameter: Left GRF_max_TD_END_WA_VH_L
  where:
    name: VH_L*
    force: left
  set: left
  steps:
    - eventMask: [Left GRF.z, TouchDown, END_WA] 
    - max:

- parameter: Right GRF_max_TD_END_WA_VH_R
  where:
    name: VH_R*
    force: right
  set: right
  steps:
    - eventMask: [Right GRF.z, TouchDown, END_WA]
    - max:

# .z is removed in accordance with other pipelines, which will return all components of the vector, but only the vertical component is required #

################# Symmetry Index ################# 
# 200*(R-L)/(R+L)

# TouchDown - seven XYZ signals
# Angles & Moments â€“ Hip â€“ Knee â€“ Ankle

- parameter: Hip_Angles_SYM_TouchDown_mean_VH_L
  where:
    name: VH*
  steps:
    - add: [Left Hip Angles_TouchDown_VH_L?name=Lab%20Defined%20-%20Vertical%20Hop%20Left*&index=first, Left Hip Angles_TouchDown_VH_L?name=Lab%20Defined%20-%20Vertical%20Hop%20Left*&index=last]
    - divide: [$prev, 2]

- parameter: Hip_Angles_SYM_TouchDown_mean_VH_R
  where:
    name: VH*
  steps:
    - add: [Right Hip Angles_TouchDown_VH_R?name=Lab%20Defined%20-%20Vertical%20Hop%20Right*&index=first, Right Hip Angles_TouchDown_VH_R?name=Lab%20Defined%20-%20Vertical%20Hop%20Right*&index=last]
    - divide: [$prev, 2]

- parameter: Hip_Angles_SYM_TouchDown_VH
  where:
    name: VH*
  steps:
    - subtract: [Hip_Angles_SYM_TouchDown_mean_VH_R, Hip_Angles_SYM_TouchDown_mean_VH_L]

    - add: [Hip_Angles_SYM_TouchDown_mean_VH_R, Hip_Angles_SYM_TouchDown_mean_VH_L]

    - divide: [$prev(2), $prev]
    - multiply: [$prev, 200]

- parameter: Hip_Moments_SYM_TouchDown_mean_VH_L
  where:
    name: VH*
  steps:
    - add: [Left Hip Moment_TouchDown_VH_L?name=Lab%20Defined%20-%20Vertical%20Hop%20Left*&index=first, Left Hip Moment_TouchDown_VH_L?name=Lab%20Defined%20-%20Vertical%20Hop%20Left*&index=last]
    - divide: [$prev, 2]

- parameter: Hip_Moments_SYM_TouchDown_mean_VH_R
  where:
    name: VH*
  steps:
    - add: [Right Hip Moment_TouchDown_VH_R?name=Lab%20Defined%20-%20Vertical%20Hop%20Right*&index=first, Right Hip Moment_TouchDown_VH_R?name=Lab%20Defined%20-%20Vertical%20Hop%20Right*&index=last]
    - divide: [$prev, 2]

- parameter: Hip_Moments_SYM_TouchDown_VH
  where:
    name: VH*
  steps:
    - subtract: [Hip_Moments_SYM_TouchDown_mean_VH_R, Hip_Moments_SYM_TouchDown_mean_VH_L]

    - add: [Hip_Moments_SYM_TouchDown_mean_VH_R, Hip_Moments_SYM_TouchDown_mean_VH_L]

    - divide: [$prev(2), $prev]
    - multiply: [$prev, 200]

- parameter: Knee_Angles_SYM_TouchDown_mean_VH_L
  where:
    name: VH*
  steps:
    - add: [Left Knee Angles_TouchDown_VH_L?name=Lab%20Defined%20-%20Vertical%20Hop%20Left*&index=first, Left Knee Angles_TouchDown_VH_L?name=Lab%20Defined%20-%20Vertical%20Hop%20Left*&index=last]
    - divide: [$prev, 2]

- parameter: Knee_Angles_SYM_TouchDown_mean_VH_R
  where:
