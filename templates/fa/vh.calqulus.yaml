################# Jump Height/ RSI #################

- parameter: COM_displacement_MEAN_max_VH_L
  set: left
  displayName: Jump height 
  summarize: Jump_Height
  where:
    name: VH_L*
  steps:
    - import: Hips_model.z@BOF => PelvisCGPos@BOF
    - eventMask: [Hips_model.z,TakeOff,TouchDown]
    - max: $prev
    - subtract: [$prev,$prev(3)]
    - convert:
      from: mm
      to: m

- parameter: COM_displacement_MEAN_max_VH_R
  set: right
  displayName: Jump height
  summarize: Jump_Height
  where:
    name: VH_R*
  steps:
    - import: Hips_model.z@BOF => PelvisCGPos@BOF
    - eventMask: [Hips_model.z,TakeOff,TouchDown]
    - max: $prev
    - subtract: [$prev,$prev(3)]
    - convert:
      from: mm
      to: m

# # Adapted from current piplelines, @Takeoff has been replaced by BOF since athletes sometimes start movement with joint flexed postion rather than the same as doing a static trial. 

# Ground contact time (GCT) 

- parameter: ContactTime_VH_L
  set: left
  where:
    name: VH_L*
  steps:
    - eventDuration: [TouchDown_kinetic_first,TakeOff] 

- parameter: ContactTime_VH_R
  set: right
  where:
    name: VH_R*
  steps:
    - eventDuration: [TouchDown_kinetic_first,TakeOff]

# Reactive Strength Index (RSI) 

- parameter: Jump_height_contact_time_ratio_VH_L
  set: left
  displayName: Jump height / contact time
  summarize: Jump_Height_Contact_Time
  where:
    name: VH_L*
  steps:
    - divide: [COM_displacement_MEAN_max_VH_L, ContactTime_VH_L]

- parameter: Jump_height_contact_time_ratio_VH_R
  set: right
  displayName: Jump height / contact time
  summarize: Jump_Height_Contact_Time
  where:
    name: VH_R*
  steps:
    - divide: [COM_displacement_MEAN_max_VH_R, ContactTime_VH_R]

################# Jump Height/ RSI Symmetry #################

# Jump Height SYM 

- parameter: COM_displacement_MEAN_max_mean_VH_L
  where:
    name: VH*
  steps:
    - add: [COM_displacement_MEAN_max_VH_L?name=Lab%20Defined%20-%20Vertical%20Hop%20Left*&index=first, COM_displacement_MEAN_max_VH_L?name=Lab%20Defined%20-%20Vertical%20Hop%20Left*&index=last]
    - divide: [$prev, 2]

- parameter: COM_displacement_MEAN_max_mean_VH_R
  where:
    name: VH*
  steps:
    - add: [COM_displacement_MEAN_max_VH_R?name=Lab%20Defined%20-%20Vertical%20Hop%20Right*&index=first, COM_displacement_MEAN_max_VH_R?name=Lab%20Defined%20-%20Vertical%20Hop%20Right*&index=last]
    - divide: [$prev, 2]

- parameter: COM_displacement_MEAN_SYM_VH    
  where:
    name: VH*
  steps:
    - subtract: [COM_displacement_MEAN_max_mean_VH_R, COM_displacement_MEAN_max_mean_VH_L]

    - add: [COM_displacement_MEAN_max_mean_VH_R, COM_displacement_MEAN_max_mean_VH_L]

    - divide: [$prev(2), $prev]
    - multiply: [$prev, 200]

# RSI SYM

- parameter: Jump_height_contact_time_ratio_mean_VH_L
  where:
    name: VH*
  steps:
    - add: [Jump_height_contact_time_ratio_VH_L?name=Lab%20Defined%20-%20Vertical%20Hop%20Left*&index=first, Jump_height_contact_time_ratio_VH_L?name=Lab%20Defined%20-%20Vertical%20Hop%20Left*&index=last]
