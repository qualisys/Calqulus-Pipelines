    - divide: [$prev, 2]

- parameter: Jump_height_contact_time_ratio_SYM_VH    
  where:
    name: VH*
  steps:
    - subtract: [Jump_height_contact_time_ratio_mean_VH_R, Jump_height_contact_time_ratio_mean_VH_L]

    - add: [Jump_height_contact_time_ratio_mean_VH_R, Jump_height_contact_time_ratio_mean_VH_L]

