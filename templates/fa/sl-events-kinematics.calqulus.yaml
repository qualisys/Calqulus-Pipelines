############
## EVENTS ##
############

- event: BOF
  steps:
    - import: [0]

- event: EOF
  steps:
    - subtract: [$length, 1]

# Left
- event: TouchDown_kinematics
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
  set: left
  steps:
    - min: LFT_DistEndVel.z
      frames: true
    - add: [$prev, 1]

- event: TouchDown_prio2
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
  set: left
  steps:
    - if: exists(TouchDown_L_ML)
      then: TouchDown_L_ML
      else: TouchDown_kinematics

- event: TouchDown
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
  set: left
  steps:
    - if: exists(LON_force)
      then: LON_force
      else: TouchDown_prio2
    - import: $prev@1

- event: Max_knee_flex
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
  set: left
  steps:
    - eventMask: [Left Knee Angles.x, TouchDown, EOF]
    - max:
      frames: true

- event: Max_knee_flex_init
  where:
    name: ^(SLJ_|SLL_)L*
  set: left
  steps:
    - eventMask: [Left Knee Angles.x, BOF, TakeOff]
    - max:
      frames: true

- event: Max_knee_flex_landing
  where:
    name: ^(SLJ_|SLL_)L*
  set: left
  steps:
    - eventMask: [Left Knee Angles.x, TouchDown, EOF]
    - max:
      frames: true

- event: END_WA
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
    force: left
  steps:
    - eventMask: [Left GRF.z, TouchDown, EOF]
    - peakFinder: 
    - import: $prev@1

# Right
- event: TouchDown_kinematics
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
  set: right
  steps:
    - min: RFT_DistEndVel.z
      frames: true
    - add: [$prev, 1]

- event: TouchDown_prio2
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
  set: right
  steps:
    - if: exists(TouchDown_R_ML)
      then: TouchDown_R_ML
      else: TouchDown_kinematics

- event: TouchDown
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
  set: right
  steps:
    - if: exists(RON_force)
      then: RON_force
      else: TouchDown_prio2
    - import: $prev@1

- event: Max_knee_flex
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
  set: right
  steps:
    - eventMask: [Right Knee Angles.x, TouchDown, EOF]
    - max:
      frames: true

- event: Max_knee_flex_init
  where:
    name: ^(SLJ_|SLL_)R*
  set: right
  steps:
    - eventMask: [Right Knee Angles.x, BOF, TakeOff]
    - max:
      frames: true

- event: Max_knee_flex_landing
  where:
    name: ^(SLJ_|SLL_)R*
  set: right
  steps:
    - eventMask: [Right Knee Angles.x, TouchDown, EOF]
    - max:
      frames: true

- event: END_WA
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
    force: right
  steps:
    - eventMask: [Right GRF.z, TouchDown, EOF]
    - peakFinder: 
    - import: $prev@1

# For SLJ and SLCDL PlotEnd is set to 1 sec after TouchDown. For SLL it is 3 sec
- event: PlotEnd
  where:
    name: ^(SLJ|SLCDL)*
  steps:
    - multiply: [$framerate, 1] # 1 sec
    - add: [$prev, TouchDown] # 1 s after TouchDown
      export: end_fr

    - if: EOF > end_fr
      then: end_fr
      else: EOF

- event: PlotEnd
  where:
    name: SLL*
  steps:
    - multiply: [$framerate, 3] #3 sec
    - add: [$prev, TouchDown] # 3 s after TouchDown
      export: end_fr

    - if: EOF > end_fr
      then: end_fr
      else: EOF

- event: TakeOff
  where:
    name: ^(SLJ|SLL)*
  steps:
    - eventMask: [PelvisCGPos_vel.z, BOF, TouchDown]
    - max:
      frames: true
    - import: $prev@-1

- event: COM_MIN # using Pelvis for now
  steps:
    - eventMask: [Hips_model.z, TouchDown, Max_knee_flex]
    - min:
      frames: true

# Time to stabilization
# time from TouchDown to 2 seconds within 5% of BW in seconds
# Left
- event: Stabilization_last_peak_above_5pct
  where:
    name: ^(SLJ_L|SLL_L)*
    force: left
  steps:
    - peakFinder: Left GRF.z
      height: 1.05
    - eventMask: [$prev, TouchDown, EOF]
      keep: -1

- event: Stabilization_last_peak_below_5pct
  where:
    name: ^(SLJ_L|SLL_L)*
    force: left
  steps:
    - negate: Left GRF.z
    - peakFinder: $prev
      height: -0.95
    - eventMask: [$prev, TouchDown, EOF]
      keep: -1

- event: Stabilization_end
  where:
    name: ^(SLJ_L|SLL_L)*
    force: left
  steps:
    - threshold: Left GRF.z
      value: 0.95
      direction: up
    - eventMask: [$prev, Stabilization_last_peak_below_5pct, EOF]
      output: going_up
    - threshold: Left GRF.z
      value: 1.05
      direction: down
    - eventMask: [$prev, Stabilization_last_peak_above_5pct, EOF]
      output: going_gown

    - if: Stabilization_last_peak_below_5pct > Stabilization_last_peak_above_5pct
      then: going_up
      else: going_gown

# Right
- event: Stabilization_last_peak_above_5pct
  where:
    name: ^(SLJ_R|SLL_R)*
    force: right
  steps:
    - peakFinder: Right GRF.z
      height: 1.05
    - eventMask: [$prev, TouchDown, EOF]
      keep: -1

- event: Stabilization_last_peak_below_5pct
  where:
    name: ^(SLJ_R|SLL_R)*
    force: right
  steps:
    - negate: Right GRF.z
    - peakFinder: $prev
      height: -0.95
    - eventMask: [$prev, TouchDown, EOF]
      keep: -1

- event: Stabilization_end
  where:
    name: ^(SLJ_R|SLL_R)*
    force: right
  steps:
    - threshold: Right GRF.z
      value: 0.95
      direction: up
    - eventMask: [$prev, Stabilization_last_peak_below_5pct, EOF]
      output: going_up
    - threshold: Right GRF.z
      value: 1.05
      direction: down
    - eventMask: [$prev, Stabilization_last_peak_above_5pct, EOF]
      output: going_gown

    - if: Stabilization_last_peak_below_5pct > Stabilization_last_peak_above_5pct
      then: going_up
      else: going_gown

# Unified event names for web
- event: LeftPlotStart
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
  set: left
  steps:
    - import: TouchDown

- event: LeftPlotEnd
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
  set: left
  steps:
    - import: PlotEnd

- event: RightPlotStart
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
  set: right
  steps:
    - import: TouchDown

- event: RightPlotEnd
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
  set: right
  steps:
    - import: PlotEnd
