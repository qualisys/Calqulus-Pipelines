# Unified event names for web
- event: LeftPlotStart
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
  set: left
  steps:
    - import: TouchDown

- event: LeftPlotEnd
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
  set: left
  steps:
    - import: PlotEnd

- event: RightPlotStart
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
  set: right
  steps:
    - import: TouchDown

- event: RightPlotEnd
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
  set: right
  steps:
    - import: PlotEnd

#############
## Phases ##
#############

- phase: Eccentric
  summaryTarget: true
  description: "Time from TouchDown till the lowest position of pelvis"
  start: TouchDown
  end: COM_MIN

- phase: Concentric
  summaryTarget: true
  description: "Time from the lowest position of pelvis to 1 s after TouchDown"
  start: COM_MIN
  end: PlotEnd

- phase: Loading
  summaryTarget: false
  start: TouchDown
  end: Max_knee_flex

- phase: Plot
  export: false
  summaryTarget: false
  start: PlotStart
  end: PlotEnd
