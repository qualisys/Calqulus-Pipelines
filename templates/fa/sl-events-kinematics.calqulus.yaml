############
## EVENTS ##
############

- event: BOF
  steps:
    - import: [0]

- event: EOF
  steps:
    - subtract: [$length, 1]

# Left
- event: TouchDown_kinematics
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
  set: left
  steps:
    - min: LFT_DistEndVel.z
      frames: true
    - add: [$prev, 1]

- event: TouchDown_prio2
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
  set: left
  steps:
    - if: exists(TouchDown_L_ML)
      then: TouchDown_L_ML
      else: TouchDown_kinematics

- event: TouchDown
  displayName: Touchdown
  description: Instant of initial ground contact
  summaryTarget: true
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
  set: left
  steps:
    - if: exists(LON_force)
      then: LON_force
      else: TouchDown_prio2
    - import: $prev@1

- event: Max_knee_flex
  displayName: Max knee flexion
  description: Instant of maximum knee flexion
  summaryTarget: true
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
  set: left
  steps:
    - eventMask: [Left Knee Angles.x, TouchDown, EOF]
    - max:
      frames: true

- event: Max_knee_flex_init
  where:
    name: ^(SLJ_|SLL_)L*
  set: left
  steps:
    - eventMask: [Left Knee Angles.x, BOF, TakeOff]
    - max:
      frames: true

- event: Max_knee_flex_landing
  where:
    name: ^(SLJ_|SLL_)L*
  set: left
  steps:
    - eventMask: [Left Knee Angles.x, TouchDown, EOF]
    - max:
      frames: true

- event: END_WA
  displayName: End of weight acceptance
  description: Instant of end of weight acceptance
  summaryTarget: true
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
    force: left
  steps:
    - eventMask: [Left GRF.z, TouchDown, EOF]
    - peakFinder: 
    - import: $prev@1

# Right
- event: TouchDown_kinematics
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
  set: right
  steps:
    - min: RFT_DistEndVel.z
      frames: true
    - add: [$prev, 1]

- event: TouchDown_prio2
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
  set: right
  steps:
    - if: exists(TouchDown_R_ML)
      then: TouchDown_R_ML
      else: TouchDown_kinematics

- event: TouchDown
  displayName: Touchdown
  description: Instant of initial ground contact
  summaryTarget: true
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
  set: right
  steps:
    - if: exists(RON_force)
      then: RON_force
      else: TouchDown_prio2
    - import: $prev@1

- event: Max_knee_flex
  displayName: Max knee flexion
  description: Instant of maximum knee flexion
  summaryTarget: true
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
  set: right
  steps:
    - eventMask: [Right Knee Angles.x, TouchDown, EOF]
    - max:
      frames: true

- event: Max_knee_flex_init
  where:
    name: ^(SLJ_|SLL_)R*
  set: right
  steps:
    - eventMask: [Right Knee Angles.x, BOF, TakeOff]
    - max:
      frames: true

- event: Max_knee_flex_landing
  where:
    name: ^(SLJ_|SLL_)R*
  set: right
  steps:
    - eventMask: [Right Knee Angles.x, TouchDown, EOF]
    - max:
      frames: true

- event: END_WA
  displayName: End of weight acceptance
  description: Instant of end of weight acceptance
  summaryTarget: true
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
    force: right
  steps:
    - eventMask: [Right GRF.z, TouchDown, EOF]
    - peakFinder: 
    - import: $prev@1

# For SLJ and SLCDL PlotEnd is set to 1 sec after TouchDown. For SLL it is 3 sec
- event: PlotStart
  steps:
    - import: TouchDown

- event: PlotEnd
  where:
    name: ^(SLJ|SLCDL)*
  summaryTarget: false
  steps:
    - multiply: [$framerate, 1] # 1 sec
    - add: [$prev, TouchDown] # 1 s after TouchDown
      export: end_fr

    - if: EOF > end_fr
      then: end_fr
      else: EOF

- event: PlotEnd
  where:
    name: SLL*
  summaryTarget: false
  steps:
    - multiply: [$framerate, 3] #3 sec
    - add: [$prev, TouchDown] # 3 s after TouchDown
      export: end_fr

    - if: EOF > end_fr
      then: end_fr
      else: EOF

- event: TakeOff
  displayName: Take-off
  description: Instant the foot leaves the ground
  summaryTarget: true
  where:
    name: ^(SLJ|SLL)*
  steps:
    - eventMask: [PelvisCGPos_vel.z, BOF, TouchDown]
    - max:
      frames: true
    - import: $prev@-1

- event: COM_MIN # using Pelvis for now
  displayName: Lowest pelvis
  description: Instant of lowest pelvis position
  summaryTarget: true
  steps:
    - eventMask: [Hips_model.z, TouchDown, Max_knee_flex]
    - min:
      frames: true

- event: Peak_eccentric_power
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
    force: left
  steps:
    - eventMask: [Left Power.z, LeftPlotStart, COM_MIN]
    - min:
      frames: true

- event: Peak_concentric_power
  where:
    name: ^(SLJ_|SLL_|SLCDL_)L*
    force: left
  steps:
    - eventMask: [Left Power.z, COM_MIN, PlotEnd]
    - max:
      frames: true

- event: Peak_eccentric_power
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
    force: right
  steps:
    - eventMask: [Right Power.z, RightPlotStart, COM_MIN]
    - min:
      frames: true

- event: Peak_concentric_power
  where:
    name: ^(SLJ_|SLL_|SLCDL_)R*
    force: right
  steps:
    - eventMask: [Right Power.z, COM_MIN, PlotEnd]
    - max:
      frames: true
      
# Time to stabilization
# time from TouchDown to 2 seconds within 5% of BW in seconds
# Left
- event: Stabilization_last_peak_above_5pct
  where:
    name: ^(SLJ_L|SLL_L)*
    force: left
  steps:
    - peakFinder: Left GRF.z
      height: 1.05
    - eventMask: [$prev, TouchDown, EOF]
      keep: -1

- event: Stabilization_last_peak_below_5pct
  where:
    name: ^(SLJ_L|SLL_L)*
    force: left
  steps:
    - negate: Left GRF.z
    - peakFinder: $prev
      height: -0.95
    - eventMask: [$prev, TouchDown, EOF]
      keep: -1

- event: Stabilization_end
  where:
    name: ^(SLJ_L|SLL_L)*
    force: left
  steps:
    - threshold: Left GRF.z
      value: 0.95
      direction: up
    - eventMask: [$prev, Stabilization_last_peak_below_5pct, EOF]
      output: going_up
    - threshold: Left GRF.z
      value: 1.05
      direction: down
    - eventMask: [$prev, Stabilization_last_peak_above_5pct, EOF]
      output: going_gown

    - if: Stabilization_last_peak_below_5pct > Stabilization_last_peak_above_5pct
      then: going_up
      else: going_gown

# Right
- event: Stabilization_last_peak_above_5pct
  where:
    name: ^(SLJ_R|SLL_R)*
    force: right
  steps:
    - peakFinder: Right GRF.z
      height: 1.05
    - eventMask: [$prev, TouchDown, EOF]
      keep: -1

- event: Stabilization_last_peak_below_5pct
  where:
    name: ^(SLJ_R|SLL_R)*
    force: right
  steps:
    - negate: Right GRF.z
    - peakFinder: $prev
      height: -0.95
    - eventMask: [$prev, TouchDown, EOF]
      keep: -1

- event: Stabilization_end
  where:
    name: ^(SLJ_R|SLL_R)*
    force: right
  steps:
    - threshold: Right GRF.z
      value: 0.95
      direction: up
    - eventMask: [$prev, Stabilization_last_peak_below_5pct, EOF]
      output: going_up
    - threshold: Right GRF.z
      value: 1.05
      direction: down
    - eventMask: [$prev, Stabilization_last_peak_above_5pct, EOF]
      output: going_gown

    - if: Stabilization_last_peak_below_5pct > Stabilization_last_peak_above_5pct
      then: going_up
      else: going_gown

# Right
- event: Stabilization_last_peak_above_5pct
  where:
    name: ^(SLJ_R|SLL_R)*
    force: right
  steps:
    - peakFinder: Right GRF.z
      height: 1.05
    - eventMask: [$prev, TouchDown, EOF]
      keep: -1

- event: Stabilization_last_peak_below_5pct
  where:
    name: ^(SLJ_R|SLL_R)*
    force: right
  steps:
    - negate: Right GRF.z
    - peakFinder: $prev
      height: -0.95
    - eventMask: [$prev, TouchDown, EOF]
      keep: -1

- event: Stabilization_end
  where:
    name: ^(SLJ_R|SLL_R)*
    force: right
  steps:
    - threshold: Right GRF.z
      value: 0.95
      direction: up
    - eventMask: [$prev, Stabilization_last_peak_below_5pct, EOF]
      output: going_up
    - threshold: Right GRF.z
      value: 1.05
      direction: down
    - eventMask: [$prev, Stabilization_last_peak_above_5pct, EOF]
      output: going_gown

    - if: Stabilization_last_peak_below_5pct > Stabilization_last_peak_above_5pct
      then: going_up
