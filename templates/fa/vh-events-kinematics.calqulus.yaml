############################
##     Calqulus EVENTS    ##
############################

- event: PlotEnd
  where:
    name: VH*
  steps:
    - multiply: [$framerate, 2]
    - add: [$prev, TouchDown]
      export: end_fr
    - if: EOF > end_fr
      then: end_fr
      else: EOF

- event: COM_MIN
  where:
    name: VH*
  steps:
    - eventMask: [Hips_model.z, TouchDown, Max_knee_flex]
    - min:
      frames: true

# Unified event names for web - same as old sl-event-kinetic
- event: LeftPlotStart
  where:
    name: VH_L*
  set: left
  steps:
    - import: TouchDown

- event: LeftPlotEnd # This should be 2 second after TouchDown
  where:
    name: VH_L*
  set: left
  steps:
    - import: PlotEnd

- event: RightPlotStart
  where:
    name: VH_R*
  set: right
  steps:
    - import: TouchDown

- event: RightPlotEnd
  where:
    name: VH_R*
  set: right
  steps:
    - import: PlotEnd

###  END OF THE EVENT CODE ###