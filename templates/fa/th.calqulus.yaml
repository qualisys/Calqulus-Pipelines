################# Moment Contribution #################
# Calculation applied to the signal.x only

# Contribution â€“ Left

- parameter: MomentContri_SUM_TH_L
  where:
    name: TH_L*
    force: left
  set: left
  steps:
    - add: [Left Hip Moment_max_knee_flex_TH_L.x, Left Knee Moment_max_knee_flex_TH_L.x, Left Ankle Moment_max_knee_flex_TH_L.x]

- parameter: MomentContri_Hip_TH_L
  where:
    name: TH_L*
    force: left
  set: left
  steps:
    - divide: [Left Hip Moment_max_knee_flex_TH_L.x, MomentContri_SUM_TH_L]
    - multiply: [$prev, 100]

- parameter: MomentContri_Knee_TH_L
  where:
    name: TH_L*
    force: left
  set: left
  steps:
    - divide: [Left Knee Moment_max_knee_flex_TH_L.x, MomentContri_SUM_TH_L]
    - multiply: [$prev, 100]

- parameter: MomentContri_Ankle_TH_L
  where:
    name: TH_L*
    force: left
  set: left
  steps:
    - divide: [Left Ankle Moment_max_knee_flex_TH_L.x, MomentContri_SUM_TH_L]
    - multiply: [$prev, 100]

# Contribution â€“ Right

- parameter: MomentContri_SUM_TH_R
  where:
    name: TH_R*
    force: right
  set: right
  steps:
    - add: [Right Hip Moment_max_knee_flex_TH_R.x, Right Knee Moment_max_knee_flex_TH_R.x, Right Ankle Moment_max_knee_flex_TH_R.x]

- parameter: MomentContri_Hip_TH_R
  where:
    name: TH_R*
    force: right
  set: right
  steps:
    - divide: [Right Hip Moment_max_knee_flex_TH_R.x, MomentContri_SUM_TH_R]
