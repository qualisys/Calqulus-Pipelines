################# Symmetry Index ################# 
# 200*(R-L)/(R+L)

# TouchDown - seven XYZ signals
# Angles & Moments â€“ Hip â€“ Knee â€“ Ankle

- parameter: Hip_Angles_SYM_TouchDown_mean_TH_L
  where:
    name: TH*
  steps:
    - add: [Left Hip Angles_TouchDown_TH_L?name=Lab%20Defined%20-%20Triple%20Hop%20Left*&index=first, Left Hip Angles_TouchDown_TH_L?name=Lab%20Defined%20-%20Triple%20Hop%20Left*&index=last]
    - divide: [$prev, 2]

- parameter: Hip_Angles_SYM_TouchDown_mean_TH_R
  where:
    name: TH*
  steps:
    - add: [Right Hip Angles_TouchDown_TH_R?name=Lab%20Defined%20-%20Triple%20Hop%20Right*&index=first, Right Hip Angles_TouchDown_TH_R?name=Lab%20Defined%20-%20Triple%20Hop%20Right*&index=last]
    - divide: [$prev, 2]

- parameter: Hip_Angles_SYM_TouchDown_TH
  where:
    name: TH*
  steps:
    - subtract: [Hip_Angles_SYM_TouchDown_mean_TH_R, Hip_Angles_SYM_TouchDown_mean_TH_L]

    - add: [Hip_Angles_SYM_TouchDown_mean_TH_R, Hip_Angles_SYM_TouchDown_mean_TH_L]

    - divide: [$prev(2), $prev]
    - multiply: [$prev, 200]

- parameter: Hip_Moments_SYM_TouchDown_mean_TH_L
  where:
    name: TH*
  steps:
    - add: [Left Hip Moment_TouchDown_TH_L?name=Lab%20Defined%20-%20Triple%20Hop%20Left*&index=first, Left Hip Moment_TouchDown_TH_L?name=Lab%20Defined%20-%20Triple%20Hop%20Left*&index=last]
    - divide: [$prev, 2]

- parameter: Hip_Moments_SYM_TouchDown_mean_TH_R
  where:
    name: TH*
  steps:
    - add: [Right Hip Moment_TouchDown_TH_R?name=Lab%20Defined%20-%20Triple%20Hop%20Right*&index=first, Right Hip Moment_TouchDown_TH_R?name=Lab%20Defined%20-%20Triple%20Hop%20Right*&index=last]
    - divide: [$prev, 2]

- parameter: Hip_Moments_SYM_TouchDown_TH
  where:
    name: TH*
  steps:
    - subtract: [Hip_Moments_SYM_TouchDown_mean_TH_R, Hip_Moments_SYM_TouchDown_mean_TH_L]

    - add: [Hip_Moments_SYM_TouchDown_mean_TH_R, Hip_Moments_SYM_TouchDown_mean_TH_L]

    - divide: [$prev(2), $prev]
    - multiply: [$prev, 200]

- parameter: Knee_Angles_SYM_TouchDown_mean_TH_L
  where:
    name: TH*
  steps:
    - add: [Left Knee Angles_TouchDown_TH_L?name=Lab%20Defined%20-%20Triple%20Hop%20Left*&index=first, Left Knee Angles_TouchDown_TH_L?name=Lab%20Defined%20-%20Triple%20Hop%20Left*&index=last]
    - divide: [$prev, 2]

- parameter: Knee_Angles_SYM_TouchDown_mean_TH_R
  where:
    name: TH*
  steps:
    - add: [Right Knee Angles_TouchDown_TH_R?name=Lab%20Defined%20-%20Triple%20Hop%20Right*&index=first, Right Knee Angles_TouchDown_TH_R?name=Lab%20Defined%20-%20Triple%20Hop%20Right*&index=last]
    - divide: [$prev, 2]

- parameter: Knee_Angles_SYM_TouchDown_TH
  where:
