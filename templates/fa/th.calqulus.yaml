############
## SPACES ##
############

- space: VirtualLab
  alignWithSegment:
    segment: Hips_model

############
## EVENTS ##
############

- event: LOFF_force
  where:
    name: TH_L*
    force: left
  set: left
  steps:
    - if: exists(LeftFootContact.events.off)
      then: LeftFootContact.events.off
      else: [[]]

- event: ROFF_force
  where:
    name: TH_R*
    force: right
  set: right
  steps:
    - if: exists(RightFootContact.events.off)
      then: RightFootContact.events.off
      else: [[]]

# Return an empty event when LOFF/ROFF absent. Trials without force skip this block.

- template: /templates/events-kinetics.calqulus.yaml
  where:
    force: any

- template: th-events-kinematics.calqulus.yaml

############
## SERIES ##
############

- template: /templates/timeseries.calqulus.yaml


